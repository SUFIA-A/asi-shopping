services:
  - type: web
    name: asi-shopping
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DROPSOURCE_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
