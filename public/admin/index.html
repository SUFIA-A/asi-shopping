<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ASI Shopping Admin</title><link rel="stylesheet" href="/admin/admin.css"></head><body>
<section id="login" class="login"><form id="loginForm"><img src="/assets/asi-logo.jpeg"><h1>ASI Shopping Admin</h1><input id="password" type="password" placeholder="Admin password" required><button>Login</button><p id="loginMsg"></p></form></section>
<section id="app" style="display:none"><header><div class="bar"><b>ASI SHOPPING</b><nav><a href="/">Store</a><button onclick="logout()">Logout</button></nav></div></header><main>
<div class="stats" id="stats"></div>
<section class="panel"><h2>Global Pricing</h2><div class="row"><label>Default markup % <input id="markup" type="number" min="0" max="500"></label><button onclick="applyGlobalMarkup()">Preview prices</button><button onclick="saveSettings()">Save Global Settings</button></div><div class="row"><label>WhatsApp <input id="wa"></label><label>Facebook Page <input id="fb"></label></div><p class="hint">Example: 30% markup makes ৳500 cost → ৳650 selling price. Individual products can override the markup or selling price.</p></section>
<section class="panel"><div class="sectionhead"><h2>Products</h2><input id="pq" placeholder="Search products"></div><div class="tablewrap"><table><thead><tr><th></th><th>Product</th><th>Cost</th><th>Selling Price</th><th>Markup</th><th>ON/OFF</th><th></th></tr></thead><tbody id="products"></tbody></table></div></section>
<section class="panel"><div class="sectionhead"><h2>Orders Dashboard</h2><button onclick="refresh()">Refresh</button></div><div class="tablewrap"><table><thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th><th>Track</th></tr></thead><tbody id="orders"></tbody></table></div></section>
</main></section><script src="/admin/admin.js"></script></body></html>
